
name: Local audit safety

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  local-audit-safety:
    name: Local audit safety smoke chain
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Validate CI workflow contract
        run: python scripts/48_smoke_ci_safety_workflow.py

      - name: Run structured proposal risk smoke chain
        run: npm run smoke:phase-w

      - name: Validate Phase Z CI contract
        run: python scripts/51_smoke_ci_phase_z_chain.py

      - name: Run complete patch proposal smoke chain
        run: npm run smoke:phase-z

      - name: Validate Phase AC CI contract
        run: python scripts/54_smoke_ci_phase_ac_chain.py

      - name: Run complete handoff copy smoke chain
        run: npm run smoke:phase-ac

      - name: Validate Phase AE CI contract
        run: python scripts/56_smoke_ci_phase_ae_chain.py

      - name: Run complete handoff download smoke chain
        run: npm run smoke:phase-ae

      - name: Validate Phase AG CI contract
        run: python scripts/58_smoke_ci_phase_ag_chain.py

      - name: Run complete handoff readiness smoke chain
        run: npm run smoke:phase-ag

      - name: Validate Phase AI CI contract
        run: python scripts/60_smoke_ci_phase_ai_chain.py

      - name: Run complete handoff JSON export smoke chain
        run: npm run smoke:phase-ai

      - name: Validate Phase AK CI contract
        run: python scripts/62_smoke_ci_phase_ak_chain.py

      - name: Run complete handoff fingerprint smoke chain
        run: npm run smoke:phase-ak

      - name: Validate Phase AM CI contract
        run: python scripts/64_smoke_ci_phase_am_chain.py

      - name: Run complete fingerprint comparison smoke chain
        run: npm run smoke:phase-am

      - name: Validate Phase AO chat navigation contract
        run: python scripts/66_smoke_ci_phase_ao_chain.py

      - name: Run complete chat navigation smoke chain
        run: npm run smoke:phase-ao

      - name: Validate Phase AQ central chat contract
        run: python scripts/68_smoke_ci_phase_aq_chain.py

      - name: Run complete central chat smoke chain
        run: npm run smoke:phase-aq
